services:
  # База данных PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: cookassist_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Back/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./Back/seeds/seed_allergens.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cookassist_network

  # Backend API
  backend:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: cookassist_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./Back/logs:/app/logs
      - backend_data:/app/data
    networks:
      - cookassist_network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: cookassist_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cookassist_network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local

networks:
  cookassist_network:
    driver: bridge
