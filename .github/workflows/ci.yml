name: Project checks

on:
  push:
    branches: [main, 'lab-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            Back/package-lock.json
            Front/package-lock.json
      - run: npm run setup
      - run: npm test
      - run: npm run check
      - run: npm run build
